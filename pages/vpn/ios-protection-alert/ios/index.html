<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iOS Style Alert</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="overlay">
      <div class="alert-box">
        <div class="alert-content">
          <h2 class="alert-title">VPN Protection required right now!</h2>
          <p class="alert-message">
            Your data has appeared in a data leak, which puts this device at
            high risk of compromise. Proceed to the App Store
          </p>
          <span class="alert-time">1:16</span>
        </div>
        <a
          href="https://app.appsflyer.com/id1532377665?pid=appmontizemedia_int&c=appm&af_siteid={AFFID}&af_sub_siteid={SUB_AFFID}&af_sub1={SUB_AFFID}&af_channel=affiliate&af_click_lookback=7d&clickid={TID}&idfa={DEVICE_ID}&advertising_id={DEVICE_ID}&af_prt=appmontize"
          style="text-decoration: none"
        >
          <div class="alert-buttons">
            <button class="alert-btn">Settings</button>
            <div class="btn-divider"></div>
            <button class="alert-btn alert-btn-bold">OK</button>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
